name: QA Approval

# One approval per pull request. jewel-shajan or Kavin-Trimble approves the
# qa-review environment. Either one is enough. A new commit cancels the
# approval that is still waiting and asks for approval of the new commit.
# Dependabot pull requests use qa-review-bot-bypass.

on:
  pull_request:
    branches: [main]

permissions: {}

# Each push used to start a new qa-review deployment while older ones stayed
# "waiting", so the PR kept showing Expected even after a later run succeeded.
concurrency:
  group: qa-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa-approval:
    runs-on: ubuntu-latest
    environment: ${{ (github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'github-actions[bot]') && 'qa-review' || 'qa-review-bot-bypass' }}
    steps:
      - name: QA Approved
        run: echo "QA has approved this PR"
