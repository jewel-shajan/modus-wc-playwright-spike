name: QA Approval

on:
  pull_request:
    branches: [main]

permissions: {}

# Each push used to start a new qa-review deployment while older ones stayed
# "waiting", so the PR kept showing Expected even after a later run succeeded.
concurrency:
  group: qa-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa-approval:
    runs-on: ubuntu-latest
    environment: ${{ (github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'github-actions[bot]') && 'qa-review' || 'qa-review-bot-bypass' }}
    steps:
      - name: QA Approved
        run: echo "QA has approved this PR"
